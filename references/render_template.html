<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    #root { display: inline-block; }
    #root svg { display: block; }
  </style>
  <script>
    // React and Excalidraw are compiled into one vendored IIFE bundle (rebuild with
    // build_vendor.sh) and loaded from disk. EXCALIDRAW_ASSET_PATH points at a sentinel
    // host: render_excalidraw.py serves it from vendor/ via request interception and
    // blocks every other http(s) request, so rendering never touches the network and
    // the bundle's baked-in CDN asset fallback can never win.
    window.process = window.process || { env: { NODE_ENV: "production" } };
    window.EXCALIDRAW_ASSET_PATH = "https://excalidraw-assets.local/";
    window.__moduleReady = null;
    window.__moduleError = null;
    window.addEventListener("error", function (e) {
      window.__moduleError = String((e && (e.message || e.error)) || "unknown error");
    });
  </script>
  <script src="vendor/excalidraw.bundle.js"></script>
  <script>
    // exportToSvg present means the bundle loaded and exposed its API. Anything else
    // fails fast with a pointed message instead of the browser's cross-origin-masked
    // "Script error." or an opaque timeout.
    if (window.ExcalidrawLib && typeof window.ExcalidrawLib.exportToSvg === "function") {
      window.__moduleReady = true;
    } else {
      window.__moduleReady = false;
      window.__moduleError = window.__moduleError || "vendor/excalidraw.bundle.js failed to load";
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    window.renderDiagram = async function (jsonData) {
      try {
        const data = typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        const elements = data.elements || [];
        const appState = data.appState || {};
        const files = data.files || {};
        appState.viewBackgroundColor = appState.viewBackgroundColor || "#ffffff";
        appState.exportWithDarkMode = false;
        // Excalidraw catches per-element render exceptions and reports them only via
        // console.error, delivering an SVG that silently misses those elements (e.g. a
        // freedraw element without its pressures array). Capture the calls during
        // export and fail the render instead.
        const consoleErrors = [];
        const originalConsoleError = console.error;
        console.error = function (...args) {
          consoleErrors.push(args.map(a => (a && a.message) || String(a)).join(" "));
          originalConsoleError.apply(console, args);
        };
        let svg;
        try {
          svg = await window.ExcalidrawLib.exportToSvg({
            elements: elements,
            appState: { ...appState, exportBackground: true },
            files: files,
          });
        } finally {
          console.error = originalConsoleError;
        }
        if (consoleErrors.length > 0) {
          throw new Error("element(s) failed to render: " + consoleErrors.join("; "));
        }
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(svg);
        window.__renderComplete = true;
        window.__renderError = null;
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = err && err.message ? err.message : String(err);
      }
    };
  </script>
</body>
</html>
